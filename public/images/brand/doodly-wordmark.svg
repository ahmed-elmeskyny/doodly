  <title id="logo-title">Doodly — wordmark</title>
  <desc id="logo-description">Playful hand-drawn Doodly wordmark with double-o eyes, a smile, and three warm yellow idea rays. No tagline. Transparent background. All artwork is editable vector geometry with no fonts, raster images, or external resources. Ink #212427; warm yellow #FFB72F.</desc>
