  <title id="logo-title">Doodly — eyes and smile icon</title>
  <desc id="logo-description">The original double-o eyes, smile, and three warm yellow idea rays, isolated from the Doodly wordmark. Transparent background. All artwork is editable vector geometry with no fonts, raster images, or external resources. Ink #212427; warm yellow #FFB72F.</desc>
